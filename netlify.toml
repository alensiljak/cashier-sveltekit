[build]
# publish = "/"
publish = "build"
# Default build command.
command = "npm run build"

#[context.production]

[[headers]]
for = "/service-worker.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/build-info.json"
[headers.values]
Cache-Control = "no-cache"
#X-Frame-Options = "DENY"
#X-XSS-Protection = "1; mode=block"

# SPA fallback: unknown paths (e.g. parameterised routes that are not prerendered) get the app shell.
[[redirects]]
from = "/*"
to = "/200.html"
status = 200
