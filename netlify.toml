[build]
# publish = "/"
publish = "build"
# Default build command.
command = "npm run build"

#[context.production]

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/workbox-*.js"
